name: 'Setup Java and Maven Cache'
description: 'Sets up Temurin JDK 21 and enables the Maven dependency cache'

runs:
  using: 'composite'
  steps:
    - name: Set up Java
      uses: actions/setup-java@5eea775e2070c6de46ae15719118a8d76af3f79c
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
