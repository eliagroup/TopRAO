site_name: TopRao - Topology and Remedial Action Optimization

repo_url: https://github.com/eliagroup/TopRao
repo_name: EliaGroup-OpenSource/TopRao

copyright: Copyright &copy; 2026 <a href="https://www.eliagroup.eu/">50Hertz Transmission GmbH and Elia Transmission Belgium SA/NV</a>. Correspondence to <a href="mailto:toop@eliagroup.eu">toop@eliagroup.eu</a>.
strict: true

docs_dir: docs
theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: "#"

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Usage:
      - Command line interface: usage.md
      - Redispatch computation: redispatch.md
      - CRAC generation parameters: crac_generation_params.md